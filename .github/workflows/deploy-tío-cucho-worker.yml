name: Deploy Tio Cucho Live Worker

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/worker.js
      - .github/workflows/deploy-tío-cucho-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy cloudflare/worker.js --name tio-cucho-live-aprobaciones
